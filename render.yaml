# Render.com blueprint — the always-on viewer for the dashboard.
# It only SERVES the report and triggers GitHub builds; the heavy compute runs on
# GitHub Actions (16 GB runner), so this can live happily on the free 512 MB tier.
# In Render: New +  ->  Blueprint  ->  pick this repo. It reads this file, then
# prompts for the secret values below. Full walkthrough: DEPLOY.md.
services:
  - type: web
    name: asymmetric-allocator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: gunicorn webapp:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Which repo + workflow to trigger and read the report from.
      - key: GH_REPO
        value: ranvirv1/asymmetric-allocator
      - key: GH_REF
        value: main
      # Fine-grained GitHub token: Actions = Read+Write, Contents = Read (this repo).
      # Lets the Refresh button start the build and pull the published report.
      - key: GH_TOKEN
        sync: false
      # Password-gate the public URL (Basic Auth). Set BOTH or the site is open.
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
# NOTE: FRED_API_KEY / FMP_API_KEY do NOT go here anymore — they belong to the
# GitHub Actions build. Add them under: repo Settings -> Secrets and variables ->
# Actions -> New repository secret. See DEPLOY.md.
