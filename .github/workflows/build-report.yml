name: build-report

# Builds the weekly allocation book on GitHub's runners (16 GB RAM — no OOM, unlike
# the 512 MB web host) and publishes the rendered report to the `live-report` branch,
# which the web app serves. Triggered on a schedule and on demand (the dashboard's
# "Refresh data" button calls the workflow_dispatch API).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Allocation mode"
        type: choice
        options: [safe, returns]
        default: safe
  schedule:
    - cron: "13 11 * * 1"   # Mondays 11:13 UTC (off-minute on purpose)

# Allow the job to force-push the single-file report branch.
permissions:
  contents: write

# Don't let two builds publish the branch at once; queue them instead.
concurrency:
  group: build-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build the book
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONUTF8: "1"
        # On schedule, inputs.mode is empty -> default to safe.
        run: python scripts/weekly_run.py noopen ${{ github.event.inputs.mode || 'safe' }}

      - name: Publish report to live-report branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f reports/latest.html || { echo "no report produced"; exit 1; }
          tmp="$(mktemp -d)"
          cp reports/latest.html "$tmp/latest.html"
          # Stamp when/what built so the app (and you) can see freshness at a glance.
          date -u +%FT%TZ > "$tmp/built_at.txt"
          echo "${{ github.event.inputs.mode || 'safe' }}" > "$tmp/mode.txt"
          cd "$tmp"
          git init -q
          git checkout -q -b live-report
          git -c user.name=github-actions[bot] \
              -c user.email=github-actions[bot]@users.noreply.github.com \
              add latest.html built_at.txt mode.txt
          git -c user.name=github-actions[bot] \
              -c user.email=github-actions[bot]@users.noreply.github.com \
              commit -q -m "report (${{ github.event.inputs.mode || 'safe' }}) $(cat built_at.txt)"
          # Force-push a fresh single commit so the branch never accumulates history.
          git push -q -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            live-report
